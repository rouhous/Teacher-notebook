name: School edition checks
on:
  push:
    branches: [school-edition-staging]
  pull_request:
    paths:
      - 'school-edition/**'
      - 'package.json'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
