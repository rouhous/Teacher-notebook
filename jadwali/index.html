<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>جدولي | إدارة الدروس الخصوصية</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f7fa;
    color:#222;
}

body{
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:1400px;
    margin:auto;
    padding:4px;
}

/* ================= HEADER ================= */

.header{
    background:#fff;
    border-radius:9px;
    padding:6px;
    margin-bottom:5px;
    box-shadow:0 1px 5px rgba(0,0,0,.10);
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:5px;
}

.title{
    font-size:15px;
    font-weight:bold;
    color:#b71c1c;
}

.add-btn{
    border:0;
    background:#198754;
    color:#fff;
    border-radius:6px;
    padding:6px 9px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.income-box{
    margin-top:5px;
    background:#eef7ee;
    border:1px solid #c9e6ca;
    border-radius:6px;
    padding:5px;
    text-align:center;
}

.income-label{
    font-size:9px;
    color:#555;
}

.income-value{
    font-size:15px;
    font-weight:bold;
    color:#198754;
    margin-top:1px;
}

/* ================= WEEK ================= */

.week-title{
    background:#343a40;
    color:#fff;
    text-align:center;
    font-size:11px;
    font-weight:bold;
    padding:5px;
    border-radius:6px 6px 0 0;
}

.week-table{
    width:100%;
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:1px;
    background:#c5c5c5;
    border:1px solid #c5c5c5;
    border-top:0;
}

.day-column{
    min-width:0;
    background:#fff;
    display:flex;
    flex-direction:column;
}

.day-header{
    background:#e1e5e8;
    text-align:center;
    padding:3px 1px;
    border-bottom:1px solid #bbb;
    font-weight:bold;
    font-size:8px;
    line-height:1.2;
    min-height:28px;
}

.day-date{
    display:block;
    font-size:6px;
    font-weight:normal;
    color:#666;
    margin-top:1px;
}

.students-list{
    display:flex;
    flex-direction:column;
    width:100%;
}

.student-card{
    border-bottom:1px solid #ddd;
    padding:3px 1px;
    min-height:43px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    cursor:pointer;
    overflow:hidden;
}

.student-card:last-child{
    border-bottom:none;
}

.student-card:active{
    background:#eef5ff;
}

.student-name{
    width:100%;
    font-size:8px;
    line-height:1.2;
    font-weight:bold;
    color:#0756a3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.student-grade{
    font-size:6.5px;
    color:#555;
    margin-top:1px;
    white-space:nowrap;
}

.student-time{
    font-size:7px;
    color:#198754;
    font-weight:bold;
    margin-top:1px;
    white-space:nowrap;
}

.completed-mark{
    color:#198754;
    font-size:7px;
}

.empty-day{
    min-height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#aaa;
    font-size:7px;
}

/* ================= MODALS ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.48);
    z-index:1000;
    padding:10px;
    align-items:center;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#fff;
    width:100%;
    max-width:430px;
    max-height:94vh;
    overflow-y:auto;
    border-radius:11px;
    padding:10px;
    box-shadow:0 5px 25px rgba(0,0,0,.25);
}

.modal-title{
    font-size:14px;
    font-weight:bold;
    text-align:center;
    margin-bottom:8px;
    color:#333;
}

.close-btn{
    width:100%;
    border:0;
    background:#6c757d;
    color:#fff;
    border-radius:6px;
    padding:7px;
    font-size:10px;
    margin-top:5px;
    cursor:pointer;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:6px;
}

.form-group label{
    display:block;
    font-size:9px;
    font-weight:bold;
    margin-bottom:2px;
    color:#444;
}

.form-group input,
.form-group select{
    width:100%;
    padding:7px;
    border:1px solid #ccc;
    border-radius:5px;
    font-family:inherit;
    font-size:11px;
    background:#fff;
}

.primary-btn,
.secondary-btn,
.warning-btn,
.danger-btn{
    width:100%;
    border:0;
    padding:8px;
    border-radius:6px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:3px;
}

.primary-btn{
    background:#198754;
    color:#fff;
}

.secondary-btn{
    background:#0d6efd;
    color:#fff;
}

.warning-btn{
    background:#ffc107;
    color:#222;
}

.danger-btn{
    background:#dc3545;
    color:#fff;
}

/* ================= STUDENT INFO ================= */

.student-info{
    background:#f6f7f8;
    border-radius:7px;
    padding:7px;
    margin-bottom:7px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
    padding:3px 0;
    font-size:9px;
}

.info-row:last-child{
    border-bottom:0;
}

.info-label{
    color:#666;
}

.info-value{
    font-weight:bold;
}

.completed-section{
    margin-top:8px;
    border-top:1px solid #ddd;
    padding-top:7px;
}

.completed-title{
    font-size:10px;
    font-weight:bold;
    margin-bottom:5px;
}

.lesson-history{
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:5px;
    padding:5px;
    margin-bottom:4px;
}

.history-date{
    display:flex;
    align-items:center;
    gap:4px;
    margin-bottom:4px;
}

.history-date input{
    flex:1;
    min-width:0;
    padding:5px;
    border:1px solid #ccc;
    border-radius:4px;
    font-family:inherit;
    font-size:9px;
}

.history-buttons{
    display:flex;
    gap:3px;
}

.history-buttons button{
    border:0;
    border-radius:4px;
    padding:4px 6px;
    font-family:inherit;
    font-size:8px;
    cursor:pointer;
}

.save-date-btn{
    background:#198754;
    color:#fff;
}

.delete-date-btn{
    background:#dc3545;
    color:#fff;
}

.no-history{
    text-align:center;
    color:#999;
    font-size:9px;
    padding:6px;
}

/* ================= DATE INPUT AREA ================= */

.lesson-date-box{
    background:#f1f7ff;
    border:1px solid #cfe2ff;
    border-radius:6px;
    padding:6px;
    margin-bottom:5px;
}

.lesson-date-box label{
    display:block;
    font-size:9px;
    font-weight:bold;
    margin-bottom:3px;
    color:#444;
}

.lesson-date-box input{
    width:100%;
    padding:7px;
    border:1px solid #b8cbe3;
    border-radius:5px;
    font-family:inherit;
    font-size:11px;
}

/* ================= SMALL PHONES ================= */

@media(max-width:360px){

    .container{
        padding:2px;
    }

    .title{
        font-size:12px;
    }

    .add-btn{
        font-size:8px;
        padding:5px 6px;
    }

    .income-value{
        font-size:13px;
    }

    .week-title{
        font-size:9px;
        padding:4px;
    }

    .day-header{
        font-size:7px;
        min-height:25px;
    }

    .day-date{
        font-size:5px;
    }

    .student-card{
        min-height:39px;
        padding:2px 1px;
    }

    .student-name{
        font-size:7px;
    }

    .student-grade{
        font-size:5.5px;
    }

    .student-time{
        font-size:6px;
    }

    .empty-day{
        min-height:39px;
    }
}

/* ================= LARGER SCREENS ================= */

@media(min-width:700px){

    .container{
        padding:8px;
    }

    .title{
        font-size:18px;
    }

    .add-btn{
        font-size:12px;
        padding:8px 12px;
    }

    .income-value{
        font-size:18px;
    }

    .week-title{
        font-size:13px;
    }

    .day-header{
        font-size:11px;
        min-height:38px;
    }

    .day-date{
        font-size:8px;
    }

    .student-card{
        min-height:55px;
    }

    .student-name{
        font-size:10px;
    }

    .student-grade{
        font-size:8px;
    }

    .student-time{
        font-size:9px;
    }
}


/* ================= ENHANCED DASHBOARD ================= */
:root{--brand:#16845b;--brand-dark:#116747;--ink:#263238;--muted:#6b7280;--line:#e5e7eb;--surface:#fff;--soft:#f4f8f5}
body{background:#f3f6f8;color:var(--ink)}
.container{max-width:1500px;padding:10px}
.header{border:1px solid #e8edf0;border-radius:14px;padding:12px;margin-bottom:10px}
.title{font-size:18px;color:#8e2929}
.add-btn{font-size:12px;padding:9px 13px;border-radius:9px;background:var(--brand)}
.income-box{padding:9px;border-radius:10px;background:#edf7f1;border-color:#cde7d7}
.income-label{font-size:11px}.income-value{font-size:20px}
.dashboard-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 5px;text-align:center;min-width:0}
.stat-label{font-size:10px;color:var(--muted);display:block}
.stat-value{font-size:17px;font-weight:800;color:var(--brand-dark);display:block;margin-top:3px}
.schedule-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#fff;padding:9px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;margin-top:10px}
.search-wrap{flex:1;min-width:150px}
.search-wrap input{width:100%;border:1px solid #d8dee3;border-radius:8px;padding:9px 10px;font:inherit;font-size:12px;outline:none}
.search-wrap input:focus{border-color:var(--brand);box-shadow:0 0 0 2px #16845b20}
.tool-btn{border:0;border-radius:8px;padding:9px 10px;font:inherit;font-size:11px;font-weight:bold;cursor:pointer;background:#edf3f0;color:#176746}
.tool-btn.backup{background:#eaf2ff;color:#1557a5}
.week-title{font-size:13px;padding:9px;border-radius:0;background:#30383d}
.week-table{border-radius:0 0 12px 12px;overflow:hidden;gap:1px}
.day-header{font-size:10px;min-height:42px;padding:6px 2px}
.day-date{font-size:8px}
.student-card{min-height:58px;padding:5px 2px;transition:background .15s}
.student-card:hover{background:#f0f8f3}
.student-name{font-size:10px}.student-grade{font-size:8px}.student-time{font-size:9px}
.modal-box{border-radius:15px;padding:15px}
.modal-title{font-size:17px;margin-bottom:12px}
.form-group{margin-bottom:10px}.form-group label{font-size:11px;margin-bottom:4px}
.form-group input,.form-group select{font-size:14px;padding:10px;border-radius:8px}
.primary-btn,.secondary-btn,.warning-btn,.danger-btn{font-size:13px;padding:11px;border-radius:9px;margin-top:5px}
.close-btn{font-size:13px;padding:10px;border-radius:9px}
.info-row{font-size:12px;padding:7px 2px}
.completed-title{font-size:13px}.lesson-history{padding:8px;border-radius:9px}
.history-date input{font-size:13px;padding:8px}.history-buttons button{font-size:11px;padding:7px 10px}
@media(max-width:420px){.container{padding:5px}.dashboard-stats{gap:5px}.stat-card{padding:8px 3px}.stat-label{font-size:9px}.stat-value{font-size:15px}.schedule-tools{gap:5px;padding:7px}.tool-btn{padding:8px;font-size:10px}.day-header{font-size:8px}.day-date{font-size:7px}.student-card{min-height:50px}.student-name{font-size:8px}.student-grade{font-size:7px}.student-time{font-size:8px}}
@media(min-width:700px){.container{padding:14px}.header{padding:16px}.dashboard-stats{gap:12px}.stat-card{padding:14px}.stat-label{font-size:12px}.stat-value{font-size:22px}.schedule-tools{padding:12px}.day-header{font-size:12px}.student-card{min-height:65px}.student-name{font-size:12px}.student-grade{font-size:10px}.student-time{font-size:11px}}


/* ================= MODERN 3D FINISH ================= */
:root{--brand:#14865b;--brand-dark:#086344;--ink:#24313b;--soft-shadow:0 7px 0 rgba(5,83,55,.18),0 12px 22px rgba(18,55,42,.12)}
body{background:linear-gradient(145deg,#f2f7f4 0%,#edf2f8 55%,#f8f8f5 100%);color:var(--ink)}
.container{max-width:1500px;padding:10px}
.header{border:1px solid #e4eee8;border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(26,65,48,.09)}
.title{font-size:clamp(18px,3vw,25px);color:#a52a2a}
.add-btn,.primary-btn,.save-date-btn,.tool-btn,.secondary-btn,.danger-btn,.delete-date-btn,.close-btn{
 border:0!important;border-radius:12px!important;font-weight:800!important;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease!important;
 box-shadow:0 5px 0 rgba(0,0,0,.16),0 9px 16px rgba(0,0,0,.10)!important;
}
.add-btn,.primary-btn,.save-date-btn{background:linear-gradient(180deg,#25a875,#08764e)!important;color:#fff!important}
.secondary-btn,.tool-btn{background:linear-gradient(180deg,#64748b,#3e4c5e)!important;color:#fff!important}
.danger-btn,.delete-date-btn{background:linear-gradient(180deg,#f05b65,#c92e42)!important;color:#fff!important}
button:active,.add-btn:active,.primary-btn:active,.save-date-btn:active,.tool-btn:active{transform:translateY(4px)!important;box-shadow:0 1px 0 rgba(0,0,0,.16),0 3px 7px rgba(0,0,0,.10)!important}
button:hover,.add-btn:hover,.primary-btn:hover,.save-date-btn:hover,.tool-btn:hover{filter:brightness(1.06)}
.income-box{border-radius:14px;padding:12px;background:linear-gradient(135deg,#edf8ef,#dff3e8);box-shadow:inset 0 1px 0 #fff}
.week-title{padding:11px;font-size:15px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,#3f4850,#252d34)}
.week-table{border-radius:0 0 14px 14px;overflow:hidden;gap:2px;background:#d9e1df}
.student-card{border-radius:9px!important;margin:3px!important;padding:7px 4px!important;background:linear-gradient(180deg,#fff,#f5faf7)!important;box-shadow:0 2px 0 rgba(21,95,66,.10),0 3px 8px rgba(30,50,40,.07);border:1px solid #e4eee8}
.student-name{color:#155b8b;font-weight:800}
.student-location{font-size:clamp(9px,1.5vw,12px);color:#64716d;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.student-time{font-weight:800;color:#16845b}
.modal-box{border-radius:20px!important;box-shadow:0 18px 55px rgba(0,0,0,.24)!important}
input,select{border-radius:11px!important;border:1px solid #d4ded9!important;padding:11px!important;background:#fff}
input:focus,select:focus{outline:2px solid #9bd8bd!important;border-color:#16845b!important}
@media(max-width:520px){.container{padding:6px}.header{padding:10px}.student-card{padding:6px 2px!important}.student-location{font-size:9px}}


/* ===== Compact student window layout ===== */
#studentModal .modal-box{
  max-width:560px;
  max-height:91vh;
  padding:8px;
  border-radius:14px;
}
#studentModal .modal-title{
  font-size:15px;
  margin:0 0 6px;
}
#studentModal .student-info{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 10px;
  padding:6px 9px;
  margin-bottom:6px;
}
#studentModal .info-row{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:5px 0;
  font-size:10px;
  border-bottom:1px solid #dfe3e6;
}
#studentModal .info-label{
  font-size:9px;
  line-height:1.25;
}
#studentModal .info-value{
  font-size:10px;
  text-align:left;
  line-height:1.25;
  overflow-wrap:anywhere;
}
#studentModal .lesson-date-box{
  padding:5px 7px;
  margin:4px 0;
}
#studentModal .lesson-date-box label{
  font-size:9px;
  margin-bottom:2px;
}
#studentModal .lesson-date-box input{
  padding:5px 7px;
  font-size:10px;
}
#studentModal #studentActions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px;
  margin:5px 0;
}
#studentModal #studentActions button{
  width:100%;
  min-width:0;
  min-height:36px;
  padding:6px 4px;
  margin:0;
  border-radius:7px;
  font-size:10px;
  line-height:1.25;
}
#studentModal .completed-section{
  margin-top:5px;
  padding-top:5px;
}
#studentModal .completed-title{
  font-size:10px;
  margin-bottom:4px;
}
#studentModal .lesson-history{
  padding:4px;
  margin-bottom:3px;
}
#studentModal .history-date{
  gap:3px;
  margin-bottom:3px;
}
#studentModal .history-buttons{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:4px;
}
#studentModal .history-buttons button{
  width:100%;
  padding:5px 3px;
  margin:0;
  font-size:9px;
}
#studentModal > .modal-box > .close-btn{
  width:calc(50% - 3px);
  display:block;
  margin:6px auto 0;
  padding:6px;
  font-size:10px;
}
@media(max-width:390px){
  #studentModal .modal-box{padding:6px;max-height:92vh}
  #studentModal .student-info{gap:0 6px;padding:5px 7px}
  #studentModal .info-row{font-size:9px;gap:3px}
  #studentModal .info-label{font-size:8px}
  #studentModal .info-value{font-size:9px}
  #studentModal #studentActions button{font-size:9px;min-height:33px}
}


/* Compact financial summary */
.finance-strip{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px;padding:6px;background:#edf7f1;border:1px solid #cde7d7;border-radius:10px}
.finance-group{display:flex;align-items:center;justify-content:space-around;gap:5px;min-width:0;flex-wrap:wrap;font-size:10px;color:#52615a;line-height:1.35}
.finance-group+ .finance-group{border-right:1px solid #c8ddd0}
.finance-heading{font-weight:800;color:#176746;width:100%;text-align:center;font-size:10px}
.finance-group b{color:#263238;font-size:10px;white-space:nowrap}
.finance-group .finance-remaining{color:#16845b}
.compact-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:5px}
.compact-stats .stat-card{padding:4px 2px;border-radius:7px}
.compact-stats .stat-label{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-stats .stat-value{font-size:12px;margin-top:0}
@media(max-width:380px){.finance-strip{gap:2px;padding:4px}.finance-group{font-size:9px;gap:3px}.finance-group b{font-size:9px}.finance-heading{font-size:9px}}


/* Stable ISO date display: avoids Android RTL native date segment reversal */
.date-picker-wrap{position:relative;width:100%;min-height:44px;direction:ltr!important}
.date-picker-wrap .native-date-source{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;opacity:0!important;z-index:2!important;pointer-events:none!important;padding:0!important;border:0!important}
.date-picker-display{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;border:1px solid #d4ded9;border-radius:11px;background:#fff;color:#263238;font:inherit;font-size:14px;text-align:left;direction:ltr;cursor:pointer}
.date-picker-display span:first-child{direction:ltr;unicode-bidi:isolate;font-family:Arial,sans-serif;letter-spacing:.3px}


/* One-screen phone dashboard: no page scrolling */
html,body{height:100%;overflow:hidden!important}
body{margin:0}
.container{height:100dvh;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;gap:3px;padding:3px!important;box-sizing:border-box}
.header{flex:0 0 auto;margin:0!important;padding:4px 7px!important;border-radius:9px}
.header-top.compact-actions{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:31px}
.title{font-size:13px!important;line-height:1}
.top-actions{display:flex;align-items:center;gap:5px}
.icon-action{width:34px;height:30px;min-width:34px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;font-size:18px!important;border-radius:7px}

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="header-top compact-actions">
            <div class="title-group"><div class="title">جدولي</div><button type="button" class="refresh-page-btn" onclick="forceRefreshApp()" title="تحديث التطبيق" aria-label="تحديث التطبيق">⟳</button></div>
            <div class="top-actions">
                <button class="add-btn icon-action" title="إضافة طالب" aria-label="إضافة طالب" onclick="openAddModal()">＋</button>
                <button class="tool-btn backup icon-action" title="نسخة احتياطية" aria-label="نسخة احتياطية" onclick="exportBackup()">↓</button>
                <button class="tool-btn icon-action" title="استعادة نسخة" aria-label="استعادة نسخة" onclick="document.getElementById('backupImport').click()">↑</button>
                <input id="backupImport" type="file" accept="application/json,.json" hidden onchange="importBackup(event)">
            </div>
        </div>

        <div class="finance-strip" aria-label="ملخص الاشتراكات">
          <div class="finance-group">
            <span class="finance-heading">الاشتراك الشهري</span>
            <span>الإجمالي <b id="monthlyTotal">0</b></span>
            <span>المتبقي <b class="finance-remaining" id="monthlyIncome">0</b></span>
          </div>
          <div class="finance-group">
            <span class="finance-heading">الاشتراك الفصلي</span>
            <span>الإجمالي <b id="termTotal">0</b></span>
            <span>المتبقي <b class="finance-remaining" id="termRemaining">0</b></span>
          </div>
        </div>

    </div>

    <div id="weeklySchedule" class="week-table"></div>

</div>


<!-- =====================================================
     ADD STUDENT
===================================================== -->

<div id="addModal"
     class="modal"
     onclick="closeModalOutside(event,'addModal')">

    <div class="modal-box">

        <div class="modal-title">
            إضافة طالب
        </div>

        <div class="form-group">
            <label>اسم الطالب</label>
            <input id="addName"
                   type="text"
                   autocomplete="off"
                   placeholder="اسم الطالب">
        </div>

        <div class="form-group">
            <label>الصف</label>
            <input id="addGrade"
                   type="text"
                   autocomplete="off"
                   placeholder="مثال: الصف التاسع">
        </div>

        <div class="form-group">
            <label>الموقع / المنطقة</label>
            <input id="addLocation" type="text" autocomplete="off" placeholder="مثال: حي الرفعة أو مويلح">
        </div>

        <div class="form-group">
            <label>اليوم</label>

            <select id="addDay">
                <option value="الأحد">الأحد</option>
                <option value="الإثنين">الإثنين</option>
                <option value="الثلاثاء">الثلاثاء</option>
                <option value="الأربعاء">الأربعاء</option>
                <option value="الخميس">الخميس</option>
                <option value="الجمعة">الجمعة</option>
                <option value="السبت">السبت</option>
            </select>

        </div>

        <div class="form-group">

            <label>التوقيت</label>

            <input id="addTime"
                   type="time">

        </div>

        <div class="form-group">

            <label>نوع الدفع</label>

            <select id="addPayType">
                <option value="غير محدد">غير محدد</option>
                <option value="شهري">
                    شهري
                </option>

                <option value="فصلي">
                    فصلي
                </option>

            </select>

        </div>

        <div class="form-group" id="addTermPlanWrap" style="display:none">
            <label>موعد سداد المبلغ الفصلي</label>
            <select id="addTermPlan">
                <option value="بداية الفصل">دفعة واحدة في بداية الفصل</option>
                <option value="نهاية الفصل">دفعة واحدة في نهاية الفصل</option>
                <option value="مقسم">مقسم على دفعات</option>
            </select>
        </div>

        <div class="form-group">

            <label>المبلغ</label>

            <input id="addAmount"
                   type="number"
                   min="0"
                   step="0.001"
                   placeholder="المبلغ">

        </div>

        <button class="primary-btn"
                onclick="addStudent()">
            حفظ الطالب
        </button>

        <button class="close-btn"
                onclick="closeModal('addModal')">
            إلغاء
        </button>

    </div>

</div>


<!-- PAYMENT MODAL -->
<div id="paymentModal" class="modal" onclick="closeModalOutside(event,'paymentModal')">
 <div class="modal-box">
  <div class="modal-title">تسجيل دفعة جديدة</div>
  <div class="form-group" id="paymentAmountGroup"><label>المبلغ المدفوع (ر.ع)</label><input id="paymentAmount" type="number" min="0.001" step="0.001" inputmode="decimal" placeholder="أدخل المبلغ"></div>
  <div class="form-group"><label>تاريخ الدفع</label><div class="date-picker-wrap" dir="ltr"><input id="paymentDate" class="native-date-source" type="date" lang="en-US" onchange="syncDatePickerDisplay('paymentDate')"><button type="button" class="date-picker-display" onclick="openNativeDatePicker('paymentDate')"><span id="paymentDateDisplay">اختر التاريخ</span><span aria-hidden="true">▾</span></button></div></div>
  <div id="paymentHint" style="font-size:12px;color:#64716d;margin:5px 0"></div>
  <button class="primary-btn" onclick="submitPayment()">حفظ الدفعة</button>
  <button class="close-btn" onclick="closeModal('paymentModal')">إلغاء</button>
 </div>
</div>

    "الأربعاء",
    "الخميس",
    "الجمعة",
    "السبت"
];

const STORAGE_KEY = "tuitionSchedule_v4";

const OLD_KEYS = [
    "tuitionSchedule_v3",
    "tuitionSchedule_v2",
    "tuitionSchedule_v1"
];

const INITIAL_STUDENTS_FROM_SCREENSHOT = []; // Public build: no personal student records embedded.

let students = [];

let currentStudentId = null;
let studentSearch = "";


/* =====================================================
   ID
===================================================== */

function uid(){

    return Date.now().toString(36) +
           Math.random()
           .toString(36)
           .substring(2,9);

}


/* =====================================================
   TODAY
===================================================== */

function today(){

    const d = new Date();

    const y =
        d.getFullYear();

    const m =
        String(d.getMonth()+1)
        .padStart(2,"0");

    const day =
        String(d.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${day}`;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

    if(!date) return "-";

    const d =
        new Date(date + "T00:00:00");

    return d.toLocaleDateString(
        "ar-OM",
        {
            day:"numeric",
            month:"numeric",
            year:"numeric"
        }
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SAVE DATA
===================================================== */

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(students)
        );

        return true;

    }catch(error){

        console.error(
            "خطأ في حفظ البيانات:",
            error
        );

        alert(
            "تعذر حفظ البيانات على الجهاز."
        );

        return false;

    }

}


/* =====================================================
   LOAD DATA
===================================================== */

function loadData(){

    let raw = null;

    try{

        raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        /* محاولة استرجاع النسخ القديمة */

        if(!raw){

            for(const key of OLD_KEYS){

                const oldData =
                    localStorage.getItem(key);

                if(oldData){

                    raw = oldData;

                    break;

                }

            }

        }


        if(raw){

            const parsed =
                JSON.parse(raw);

            if(Array.isArray(parsed)){

                students = parsed;

            }else if(
                parsed &&
                Array.isArray(parsed.students)
            ){

                students = parsed.students;

            }else{

                students = [];

            }

        }else{

            // نسخة عامة: تبدأ بقائمة فارغة، وتُحفظ بيانات كل مستخدم محلياً على جهازه.
            students = [];

        }


        /* تنظيف البيانات */

        students =
            students.map(st => {

                if(!st.id){
                    st.id = uid();
                }

                if(!Array.isArray(st.completed)){
                    st.completed = [];
                }
                if(typeof st.location !== "string") st.location = "";
                if(!Array.isArray(st.payments)){ st.payments = []; }
                if(typeof st.location !== "string") st.location = "";
                if(!st.termPlan && st.payType === "فصلي") st.termPlan = "بداية الفصل";

                st.completed =
                    st.completed
                        .filter(Boolean)
                        .map(String);


                if(!st.nextDueLessonsCount ||
                   typeof st.nextDueLessonsCount !== "number"){

                    recalculatePayment(st);

                }

                return st;

            });

        // دمج طلاب الصورة مرة واحدة مع أي بيانات محفوظة، دون تكرار الطالب نفسه
        for(const imported of INITIAL_STUDENTS_FROM_SCREENSHOT){
            const existing = students.find(st =>
                String(st.name || "").trim() === imported.name &&
                st.day === imported.day &&
                st.time === imported.time
            );
            if(existing){
                if(!existing.location) existing.location = imported.location;
                if(!existing.grade || existing.grade === "-") existing.grade = imported.grade;
                existing.importedFromScreenshot = true;
            }else{
                students.push({...imported});
            }
        }

        saveData();

    }catch(error){

        console.error(
            "خطأ في قراءة البيانات:",
            error
        );

        students = [];

    }

}

function totalPaid(st){return (st.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0);}
function monthlyCreditsLeft(st){const credits=(st.payments||[]).reduce((a,p)=>a+Number(p.lessonCredits||4),0);return Math.max(0,credits-(st.completed||[]).length);}
function unpaidLessons(st){const credits=(st.payments||[]).reduce((a,p)=>a+Number(p.lessonCredits||4),0);return Math.max(0,(st.completed||[]).length-credits);}

function submitPayment(){
 const st=students.find(s=>s.id===currentStudentId);if(!st)return;
 const value=st.payType==="شهري"?Number(st.amount||0):Number(document.getElementById("paymentAmount").value);
 const date=document.getElementById("paymentDate").value;
 if(!Number.isFinite(value)||value<=0){alert("يرجى التأكد من تسجيل قيمة الاشتراك الشهري في بيانات الطالب.");return;}
 if(!date){alert("يرجى اختيار تاريخ الدفع.");return;}
 if(st.payType==="فصلي"&&value>Math.max(0,Number(st.amount||0)-totalPaid(st))&&!confirm("المبلغ يتجاوز المتبقي. هل تريد تسجيله؟"))return;
 if(!Array.isArray(st.payments))st.payments=[];
 st.payments.push({id:uid(),amount:value,date:date,lessonCredits:st.payType==="شهري"?4:0});
 st.payments.sort((x,y)=>String(x.date).localeCompare(String(y.date)));
 saveData();closeModal("paymentModal");render();openStudent(st.id);
}

function completeSelectedLesson(){

    const id = currentStudentId;

    const st =
        students.find(
            s => s.id === id
        );

    if(!st) return;


    const date =
        document.getElementById(
            "lessonDate"
        ).value;


    if(!date){

        alert("يرجى اختيار تاريخ الحصة.");

        return;

    }


    if(!Array.isArray(st.completed)){

        st.completed = [];

    }


    if(st.completed.includes(date)){

        alert(
            "تم تسجيل حصة لهذا الطالب في هذا التاريخ مسبقاً."
        );

        return;

    }


    st.completed.push(date);

    st.completed.sort();


    if(st.payType === "شهري"){
        st.nextDueLessonsCount=monthlyCreditsLeft(st);
        if(st.nextDueLessonsCount===0 && unpaidLessons(st)>0){
            saveData(); render(); openStudent(id);
            alert("اكتملت الحصص الأربع المدفوعة. توجد حصص غير مدفوعة؛ سجّل الدفعة التالية عند استلامها.");

        }

    saveData();

    render();

    openStudent(id);

}


/* =====================================================
   CHANGE COMPLETED DATE
===================================================== */

function changeCompletedDate(
    studentId,
    oldDate
){

    const st =
        students.find(
            s => s.id === studentId
        );

    if(!st) return;


    const input =
        document.getElementById(
            "date_" + oldDate.replaceAll("-","")
        );


    if(!input) return;


    const newDate =
        input.value;


    if(!newDate){

        alert("يرجى اختيار تاريخ.");

        return;

    }


    if(newDate === oldDate){

        alert("لم يتم تغيير التاريخ.");

        return;

    }


    if(st.completed.includes(newDate)){

        alert(
            "يوجد حصة مسجلة مسبقاً بهذا التاريخ."
        );

        return;

    }


    const index =
        st.completed.indexOf(oldDate);


    if(index === -1) return;


    st.completed[index] = newDate;

    st.completed.sort();


    recalculatePayment(st);

    saveData();

    render();

    openStudent(studentId);


    alert("تم تعديل تاريخ الحصة وحفظه تلقائياً.");

}


/* =====================================================
   DELETE COMPLETED DATE
===================================================== */

function deleteCompletedDate(
    studentId,
    date
){

    const st =
        students.find(
            s => s.id === studentId
        );

    if(!st) return;


    const confirmed =
        confirm(
            "هل تريد حذف تسجيل هذه الحصة؟"
        );


    if(!confirmed) return;


    const index =
        st.completed.indexOf(date);


    if(index === -1) return;


    st.completed.splice(index,1);


    recalculatePayment(st);

    saveData();

    render();

    openStudent(studentId);

}


/* =====================================================
   RECALCULATE PAYMENT
===================================================== */

function recalculatePayment(st){
    if(st.payType !== "شهري"){st.nextDueLessonsCount=4;return;}
    st.nextDueLessonsCount=monthlyCreditsLeft(st);
}

/* =====================================================
   GET WEEK
===================================================== */

function getWeek(){

    const now = new Date();

    const dayIndex =
        now.getDay();


    const sunday =
        new Date(now);


    sunday.setDate(
        now.getDate() - dayIndex
    );

    sunday.setHours(
        0,0,0,0
    );


    const week = [];


    for(let i=0;i<7;i++){

        const date =
            new Date(sunday);


        date.setDate(
            sunday.getDate()+i
        );


        const y =
            date.getFullYear();

        const m =
            String(date.getMonth()+1)
            .padStart(2,"0");

        const d =
            String(date.getDate())
            .padStart(2,"0");


        week.push({

            day:DAYS[i],

            date:`${y}-${m}-${d}`

        });

    }


    return week;

}


/* =====================================================
   RENDER WEEK
===================================================== */

function monthlyCreditLedger(st){
 const events=[];
 (Array.isArray(st.payments)?st.payments:[]).forEach((p,i)=>{
  const date=String(p.date||"");
  if(date)events.push({date,kind:0,credits:Math.max(0,Number(p.lessonCredits===undefined?4:p.lessonCredits)),index:i});
 });
 (Array.isArray(st.completed)?st.completed:[]).forEach((date,i)=>{
  if(date)events.push({date:String(date),kind:1,credits:0,index:i});
 });
 events.sort((a,b)=>a.date.localeCompare(b.date)||a.kind-b.kind||a.index-b.index);
 let balance=0;
 for(const e of events){
  if(e.kind===0)balance+=e.credits;
  else balance--;
 }
 // Payments first cover lessons already completed; only the positive remainder
 // represents prepaid future lessons. Zero means no prepaid lessons remain.
 return {balance,unpaid:Math.max(0,-balance),completed:(st.completed||[]).length};
}
function monthlyCreditsLeft(st){return Math.max(0,monthlyCreditLedger(st).balance);}
function unpaidLessons(st){return monthlyCreditLedger(st).unpaid;}
function getLessonCycleStatus(st){
 const ledger=monthlyCreditLedger(st);
 if(st.payType!=="شهري")return {label:"الحصص: "+ledger.completed,color:"neutral",count:ledger.completed};
 if(ledger.balance>0)return {label:"دفع (−"+ledger.balance+")",color:"paid",count:ledger.completed};
 return {label:Math.max(0,-ledger.balance)+"/4",color:"unpaid",count:ledger.completed};
}

function renderWeekly(){
    const container=document.getElementById("weeklySchedule");
    const week=getWeek();
    container.innerHTML=week.map(item=>{
        const dayStudents=students.filter(st=>st.day===item.day).sort((a,b)=>String(a.time||"").localeCompare(String(b.time||"")));
        const studentsHTML=dayStudents.length?dayStudents.map(st=>{
            const completed=Array.isArray(st.completed)&&st.completed.includes(item.date);
            const cycle=getLessonCycleStatus(st);
            return `<div class="student-card" onclick="openStudent('${st.id}')">
                <div class="student-mainline">
                    <div class="student-name">${completed?'<span class="completed-mark">✓</span>':''}${escapeHTML(st.name||"")}</div>
                    <div class="student-grade">${escapeHTML(st.grade||"-")}</div>
                </div>
                <div class="student-subline">
                    <span class="student-location">${escapeHTML(st.location||"")}</span>
                    <span class="student-time">${escapeHTML(st.time||"")}</span>
                </div>
                <div class="lesson-counter ${cycle.color}">${escapeHTML(cycle.label)}</div>
            </div>`;
        }).join(""):'<div class="empty-day">—</div>';
        return `<div class="day-column">
            <div class="day-header">${item.day}</div>
            <div class="students-list">${studentsHTML}</div>
        </div>`;
    }).join("");
}

/* =====================================================
   MONTHLY INCOME
===================================================== */

function renderIncome(){
    const monthKey=today().slice(0,7);
    const monthlyStudents=students.filter(st=>st.payType==="شهري");
    const monthlyTotal=monthlyStudents.reduce((sum,st)=>sum+Number(st.amount||0),0);
    const monthlyPaid=monthlyStudents.reduce((sum,st)=>{
        const monthPayments=(st.payments||[]).filter(p=>String(p.date||"").slice(0,7)===monthKey);
        const completedThisMonth=(Array.isArray(st.completed)?st.completed:[]).filter(d=>String(d).slice(0,7)===monthKey).length;
        const received=monthPayments.reduce((a,p)=>a+Number(p.amount||0),0);
        // If no lesson has been logged this month and no payment was entered, assume the monthly fee is paid.
        return sum+(monthPayments.length?received:(completedThisMonth===0?Number(st.amount||0):0));
    },0);
    const monthlyRemaining=Math.max(0,monthlyTotal-monthlyPaid);
    const termStudents=students.filter(st=>st.payType==="فصلي");
    const termTotal=termStudents.reduce((sum,st)=>sum+Number(st.amount||0),0);
    const termPaid=termStudents.reduce((sum,st)=>sum+totalPaid(st),0);
    const termRemaining=Math.max(0,termTotal-termPaid);
    const fmt=v=>Number(v||0).toLocaleString("ar-OM",{maximumFractionDigits:3})+" ر.ع";
    document.getElementById("monthlyTotal").textContent=fmt(monthlyTotal);
    document.getElementById("monthlyIncome").textContent=fmt(monthlyRemaining);
    document.getElementById("termTotal").textContent=fmt(termTotal);
    document.getElementById("termRemaining").textContent=fmt(termRemaining);
}

/* =====================================================
   SEARCH, SUMMARY AND BACKUP
===================================================== */
function setStudentSearch(value){
    studentSearch = String(value || "");
    renderWeekly();
}

function renderDashboardStats(){
    const week = getWeek();
    const todayDate = today();
    const todayDay = DAYS[new Date().getDay()];
    const todayCount = students.filter(st => st.day === todayDay).length;
    const completedThisWeek = students.reduce((sum, st) => {
        const dates = Array.isArray(st.completed) ? st.completed : [];
        return sum + dates.filter(date => week.some(day => day.date === date)).length;
    }, 0);
    document.getElementById("totalStudents").textContent = students.length.toLocaleString("ar-OM");
    document.getElementById("todayLessons").textContent = todayCount.toLocaleString("ar-OM");
    document.getElementById("weekCompleted").textContent = completedThisWeek.toLocaleString("ar-OM");
}

function exportBackup(){
    const payload = {
        app: "جدولي - إدارة الدروس الخصوصية",
        formatVersion: 1,
        exportedAt: new Date().toISOString(),
        students: students
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `نسخة-احتياطية-الدروس-${today()}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
}

function importBackup(event){
    const file = event.target.files && event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
        try{
            const parsed = JSON.parse(String(reader.result || ""));
            const incoming = Array.isArray(parsed) ? parsed : parsed.students;
            if(!Array.isArray(incoming)) throw new Error("invalid backup");
            const valid = incoming.every(st => st && typeof st === "object" && typeof st.name === "string");
            if(!valid) throw new Error("invalid student records");
            if(!confirm(`سيتم استبدال البيانات الحالية ببيانات النسخة الاحتياطية (${incoming.length} طالب). هل تريد المتابعة؟`)) return;
            students = incoming.map(st => ({
                ...st,
                id: st.id || uid(),
                completed: Array.isArray(st.completed) ? st.completed.map(String) : []
            }));
            students.forEach(st => {
                if(typeof st.nextDueLessonsCount !== "number" || !st.nextDueLessonsCount){
                    recalculatePayment(st);
                }
            });
            if(saveData()){
                studentSearch = "";
                const search = document.getElementById("studentSearch");
                if(search) search.value = "";
                render();
                alert("تمت استعادة النسخة الاحتياطية بنجاح.");
            }
        }catch(error){
            alert("تعذر استيراد الملف. تأكد أنه ملف نسخة احتياطية صحيح صادر من التطبيق.");
        }finally{
            event.target.value = "";
        }
    };
    reader.readAsText(file);
}

async function forceRefreshApp(){
 const btn=document.querySelector(".refresh-page-btn");
 if(btn){btn.disabled=true;btn.textContent="…";}
 try{
  if("serviceWorker" in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.filter(reg=>new URL(reg.scope).pathname.includes("/Teacher-notebook/jadwali/")).map(reg=>reg.unregister()));
  }
  if("caches" in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith("jadwali-pwa-")).map(k=>caches.delete(k)));
  }
 }catch(e){console.warn("Refresh cleanup:",e);}
 const target=new URL(window.location.href);
 target.searchParams.set("refresh",Date.now().toString());
 window.location.replace(target.toString());
}
